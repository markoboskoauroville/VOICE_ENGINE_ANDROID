# Builds the APK on every push to main (and by hand) and publishes it as release v<appVersion> (android/gradle.properties),
# marked Latest. TEMPLATE android-gradle.yml from MANTRA_MANIFEST/workflows, with the app's own permanent key:
# KEYSTORE_B64 (base64 of ~/.voiceengine-signing/voiceengine.p12, made on the phone) and KEYSTORE_PASS.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            # A compile check only: signed with the runner's own key, kept as a run artefact, never released.
            echo "::warning::KEYSTORE_B64 / KEYSTORE_PASS missing: built as a compile check, not released."
            echo "UNSIGNED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/voiceengine.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/voiceengine.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"

      - name: Version
        id: v
        run: echo "n=$(grep '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "voice-engine-v${{ steps.v.outputs.n }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.v.outputs.n }}
          path: android/voice-engine-v${{ steps.v.outputs.n }}.apk

      - name: Release v${{ steps.v.outputs.n }}
        if: github.ref == 'refs/heads/main' && env.UNSIGNED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ steps.v.outputs.n }}
        run: |
          APK="voice-engine-v$N.apk"
          if gh release view "v$N" >/dev/null 2>&1; then
            gh release upload "v$N" "$APK" --clobber
          else
            gh release create "v$N" "$APK" --target "$GITHUB_SHA" --latest \
              --title "v$N" --notes "Built by GitHub Actions from $GITHUB_SHA. $(git log -1 --format=%s)"
          fi
          # keep the two newest releases (versioning.md §4)
          gh release list --limit 50 --json tagName -q '.[].tagName' | tail -n +3 | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
